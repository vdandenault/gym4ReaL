[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gym4real"
version = "0.1.0"
description = "Gymnasium environments for real-world reinforcement learning"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/Daveonwave/gym4ReaL"

[tool.setuptools.packages.find]
include = ["gym4real*"]

[tool.setuptools.package-data]
gym4real = ["envs/dam/*.yaml", "data/dam/**/*.csv", "data/dam/*.json"]
